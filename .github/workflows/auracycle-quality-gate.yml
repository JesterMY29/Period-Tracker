name: AuraCycle Quality Gate

on:
  push:
    branches: [main, auracycle-v2-phase1-core-engine]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
