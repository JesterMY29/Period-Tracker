name: Synchronize npm lockfile

on:
  push:
    branches: [chore/sync-package-lock]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'chore: synchronize npm lockfile'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/sync-package-lock
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate npm lockfile from package manifest
        run: npm install

      - name: Verify dependency security
        run: npm audit --audit-level=high

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize npm lockfile"
          git push origin HEAD:chore/sync-package-lock
