name: Generate Capacitor Native Projects

on:
  push:
    branches: [phase-5b-2-native-platform-generation]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: phase-5b-2-native-platform-generation

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Capacitor native toolchain
        run: |
          npm install @capacitor/ios@8.5.2 @capacitor/android@8.5.2
          npm install --save-dev @capacitor/cli@8.5.2

      - name: Build web assets
        run: npm run build

      - name: Generate iOS project with Swift Package Manager
        run: npx cap add ios --packagemanager SPM

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor projects
        run: npx cap sync

      - name: Verify generated app identity
        run: |
          grep -R "com.auracycle.app" ios android
          grep -R "AuraCycle" ios android

      - name: Remove one-shot generation workflow
        run: rm -f .github/workflows/capacitor-native-generation.yml

      - name: Commit generated native projects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ios android .github/workflows/capacitor-native-generation.yml
          git commit -m "Phase 5B-2: generate Capacitor native projects"
          git push origin HEAD:phase-5b-2-native-platform-generation
