name: AuraCycle Native Packaging Gate

on:
  push:
    branches:
      - phase-5b-2-native-platform-generation

permissions:
  contents: read

jobs:
  native-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
